<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Accomplishments — Srinivasulu IFS</title>
  <meta name="description" content="Key accomplishments across 12 departments — Karnataka Forest Department, KSPCB, AYUSH, Kali Tiger Reserve and more.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Kannada:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="accomplishments-premium.css" />
  <style>
    .page-hero {
      padding: var(--s-3) 0 !important;
    }
    .page-hero h1 {
      font-size: var(--t-24) !important;
      margin-bottom: var(--s-1) !important;
    }
    .page-hero .breadcrumb {
      margin-bottom: var(--s-1) !important;
    }
    .page-hero-stat {
      display: flex;
      align-items: baseline;
      gap: var(--s-2);
    }
    .page-hero-stat .num {
      font-size: var(--t-20) !important;
    }
    .page-hero-stat .lbl {
      font-size: var(--t-12) !important;
      margin-top: 0 !important;
    }
    .section {
      padding: var(--s-3) 0 !important;
    }
    .dept-grid {
      grid-template-columns: repeat(6, 1fr) !important;
      gap: var(--s-3) !important;
    }
    .dept-card {
      padding: var(--s-2) !important;
      min-height: 180px !important;
      justify-content: center !important;
      align-items: center !important;
      text-align: center !important;
    }
    .dept-logo {
      width: 72px !important;
      height: 72px !important;
      margin-bottom: var(--s-2) !important;
      padding: 2px !important;
    }
    .dept-card h3 {
      font-size: var(--t-12) !important;
      margin-bottom: 0 !important;
      font-weight: 500 !important;
      line-height: 1.25 !important;
    }
    .dept-meta {
      display: none !important;
    }
    .dept-arrow {
      display: none !important;
    }
    .dept-card:hover {
      transform: none !important;
    }
    @media (max-width: 1024px) {
      .dept-grid { grid-template-columns: repeat(6, 1fr) !important; }
      .dept-card { min-height: 140px !important; }
      .dept-logo { width: 44px !important; height: 44px !important; }
    }
    @media (max-width: 820px) {
      .dept-grid { grid-template-columns: repeat(4, 1fr) !important; } /* 3 rows on small tablets */
    }
    @media (max-width: 600px) {
      .dept-grid { grid-template-columns: repeat(3, 1fr) !important; }
    }
    @media (max-width: 400px) {
      .dept-grid { grid-template-columns: repeat(2, 1fr) !important; }
    }
  </style>
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>
<div id="sr-chrome-top"></div>

<main id="main" class="acc-v2">

  <section class="page-hero">
    <div class="container reveal">
      <div class="breadcrumb"><a href="index.html">Home</a> <i data-lucide="chevron-right" class="icon-sm"></i> <span>Accomplishments</span></div>
      <h1>Accomplishments</h1>
      <div style="display:flex; gap:var(--s-3); margin-top:var(--s-6); flex-wrap:wrap;">
        <div class="search-input" style="flex:1; max-width:420px;">
          <i data-lucide="search" class="icon-sm"></i>
          <input id="deptSearch" type="search" placeholder="Search across all departments…">
        </div>
        <div class="page-hero-stat" style="margin-left:auto;"><div class="num">12</div><div class="lbl">Postings on record</div></div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="dept-grid" id="deptGrid"></div>
    </div>
  </section>

</main>

<div id="sr-chrome-footer"></div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="chrome.js"></script>
<script src="app.js"></script>
<script>
window.addEventListener('load', () => {
  const data = window.SR_DEPTS_CV || [];
  const logos = window.SR_LOGOS || {};
  const grid = document.getElementById('deptGrid');

  const DEPT_CATEGORY_MAP = {
    'kspcb': ['KSPCB', 'KSPCB photos'],
    'kali-tiger-reserve': ['Kali Tiger Reserve'],
    'nagarhole-national-park': [],
    'karnataka-forest-department': ['KFD - Wildlife'],
    'shimoga': ['Forest Department - Shimogga'],
    'chitradurga': ['Forest Department - Chitradurga'],
    'kalaburagi': [],
    'academics': [],
    'adcl': ['Dr B R Ambedkar Development Corp.'],
    'ayush': ['Ayush', 'Ayush Accomplishments'],
    'kfcsc': [],
    'general': ['Accomplishments']
  };

  let accomplishmentsData = null;
  let postsData = null;

  async function loadData() {
    if (!accomplishmentsData) {
      const r = await fetch('./accomplishments.json');
      accomplishmentsData = await r.json();
    }
    if (!postsData) {
      const r = await fetch('./assets/posts-full.json');
      postsData = await r.json();
    }
  }

  // Pre-load data in the background
  loadData().catch(err => console.error('Error pre-loading accomplishments data:', err));

  async function getAccomplishments(slug){
    try {
      await loadData();
      if (!accomplishmentsData || !accomplishmentsData.departments) return [];

      const mappedCats = DEPT_CATEGORY_MAP[slug] || [];

      // Collect all items across all departments to handle potential Wix category/department misalignments
      const allAccs = [];
      const seenIds = new Set();
      for (const deptKey in accomplishmentsData.departments) {
        const list = accomplishmentsData.departments[deptKey] || [];
        for (const item of list) {
          if (!seenIds.has(item.id)) {
            seenIds.add(item.id);
            allAccs.push(item);
          }
        }
      }

      // Filter accomplishments belonging to this department
      const filtered = allAccs.filter(p => {
        if (p.dept === slug) return true;
        if (p.categories) {
          const itemCats = p.categories.split(',').map(c => c.trim().toLowerCase());
          const hasCatMatch = mappedCats.some(mc => itemCats.includes(mc.toLowerCase()));
          if (hasCatMatch) return true;
        }
        return false;
      });

      // Enrich with detailed metadata from posts-full.json
      const enriched = filtered.map(p => {
        const post = (postsData || []).find(post => post.slug === p.slug);
        return {
          title: p.title || (post && post.title) || '',
          slug: p.slug,
          postPageUrl: `posts/${p.slug}.html`,
          coverImage: (post && post.image) || '',
          publishedDate: (post && post.date) || new Date().toISOString(),
          timeToRead: (post && (post.minutesToRead || post.timeToRead)) || 0,
          viewCount: (post && post.viewCount) || 0
        };
      });

      // Sort by publication date descending
      enriched.sort((a, b) => new Date(b.publishedDate) - new Date(a.publishedDate));

      return enriched;
    } catch (error) {
      console.error(`Error filtering accomplishments for ${slug}:`, error);
      return [];
    }
  }

  function render(filter){
    const q = (filter || '').toLowerCase().trim();
    const list = q ? data.filter(d => d.name.toLowerCase().includes(q) || d.kind.toLowerCase().includes(q)) : data;
    if (!list.length){
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><i data-lucide="search-x"></i><p>No departments match that search.</p></div>';
      window.SrIcons && window.SrIcons();
      return;
    }
    grid.innerHTML = list.map(d => `
      <button class="dept-card" data-slug="${d.slug}" aria-label="${d.name}">
        <img class="dept-logo" src="${logos[d.slug] || ''}" alt="" loading="lazy">
        <h3>${d.name}</h3>
      </button>
    `).join('');
    window.SrIcons && window.SrIcons();

    grid.querySelectorAll('.dept-card').forEach(c => {
      c.addEventListener('click', () => openDept(c.dataset.slug));
    });
  }

  document.getElementById('deptSearch').addEventListener('input', e => render(e.target.value));
  render();

  // Open dept drawer
  function openDept(slug){
    const d = data.find(x => x.slug === slug);
    if (!d) return;
    const logo = logos[slug];

    // Update URL
    const url = new URL(location.href);
    url.searchParams.set('dept', slug);
    history.replaceState(null,'',url);

    // Show loading state
    const loadingHtml = `
      <header class="drawer-head">
        <img class="drawer-head-logo" src="${logo||''}" alt="">
        <div class="drawer-head-text">
          <h2>${d.name}</h2>
          <div class="meta">${d.code} · ${d.period} · ${d.kind}</div>
        </div>
        <button class="drawer-close" aria-label="Close"><i data-lucide="x"></i></button>
      </header>
      <div class="drawer-body" style="padding:var(--s-6);text-align:center;">
        <p>Loading accomplishments...</p>
      </div>
    `;
    DeptDrawer.open(loadingHtml);

    // Fetch accomplishments from Wix API
    getAccomplishments(slug).then(accomplishments => {
      const accHtml = accomplishments.length ? accomplishments.map(p => `
        <a class="item-card" href="${p.postPageUrl || '#'}" target="_blank" rel="noopener">
          <div class="item-card-img">${p.coverImage ? `<img src="${p.coverImage}" alt="" loading="lazy">` : ''}</div>
          <div class="item-card-body">
            <div class="item-card-title">${p.title}</div>
            <div class="item-card-meta">
              <span><i data-lucide="calendar" class="icon-sm"></i> ${new Date(p.publishedDate).toLocaleDateString('en-IN', {day:'numeric',month:'short',year:'numeric'})}</span>
              ${p.timeToRead ? `<span><i data-lucide="clock" class="icon-sm"></i> ${p.timeToRead} min</span>` : ''}
              ${p.viewCount ? `<span><i data-lucide="eye" class="icon-sm"></i> ${p.viewCount}</span>` : ''}
            </div>
          </div>
        </a>`).join('') :
        '<div class="empty">No accomplishments yet for this department.</div>';

      // Render drawer content
      const html = `
        <header class="drawer-head">
          <img class="drawer-head-logo" src="${logo||''}" alt="">
          <div class="drawer-head-text">
            <h2>${d.name}</h2>
            <div class="meta">${d.code} · ${d.period} · ${d.kind}</div>
          </div>
          <button class="drawer-close" aria-label="Close"><i data-lucide="x"></i></button>
        </header>
        <div class="drawer-tabs">
          <button class="tab is-active" data-target="ov-${slug}">Overview</button>
          <button class="tab" data-target="po-${slug}">Accomplishments</button>
        </div>
        <div class="drawer-body">
          <section class="tab-panel is-active" id="ov-${slug}">
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--s-3);margin-bottom:var(--s-5);">
              <div class="card" style="padding:var(--s-4);"><div class="page-hero-stat"><div class="num">${accomplishments.length}</div><div class="lbl">Accomplishments</div></div></div>
            </div>
            <p style="color:var(--ink-2); line-height:1.7;">Service: <strong>${d.period}</strong> · Role: <strong>${d.kind}</strong>. Browse the related accomplishments and updates in the next tab.</p>
            <a class="btn btn-primary btn-sm" href="publications.html?dept=${slug}" style="margin-top:var(--s-4);">View publications <i data-lucide="arrow-right" class="icon-sm"></i></a>
          </section>
          <section class="tab-panel" id="po-${slug}">
            ${accHtml}
          </section>
        </div>
      `;
      DeptDrawer.open(html);
    });
  }

  // Open from URL param
  const params = new URLSearchParams(location.search);
  const depParam = params.get('dept');
  if (depParam) setTimeout(() => openDept(depParam), 200);
});
</script>
</body>
</html>
