<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Publications — Srinivasulu IFS</title>
  <meta name="description" content="Reports, policy documents and publications across departments.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Kannada:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="publications-premium.css" />
  <style>
    .pub-card{
      background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm);
      padding:var(--s-3); display:grid; grid-template-columns:80px 1fr; gap:var(--s-4);
      margin-bottom:var(--s-3); transition:border-color var(--d-fast);
      text-decoration:none; color:inherit;
    }
    .pub-card:hover{ border-color:var(--brand); }
    .pub-cover{ aspect-ratio:3/4; background:var(--paper-2); border-radius:var(--r-xs); overflow:hidden; }
    .pub-cover img{ width:100%; height:100%; object-fit:cover; }
    .pub-body{ display:flex; flex-direction:column; }
    .pub-title{ font-family:var(--f-display); font-size:var(--t-16); font-weight:600; line-height:1.3; margin-bottom:4px; color:var(--ink); }
    .pub-meta{ font-size:var(--t-12); color:var(--ink-3); display:flex; gap:8px; flex-wrap:wrap; margin-bottom:6px; }
    .pub-actions{ display:flex; gap:6px; margin-top:auto; }
    .pub-actions .btn{ height:30px; padding:0 12px; font-size:var(--t-12); }

    /* Compact grid overrides for 6 columns and fitting in view without scrolling */
    .page-hero {
      padding: var(--s-3) 0 !important;
    }
    .page-hero h1 {
      font-size: var(--t-24) !important;
      margin-bottom: var(--s-1) !important;
    }
    .page-hero .breadcrumb {
      margin-bottom: var(--s-1) !important;
    }
    .page-hero-stat {
      display: flex;
      align-items: baseline;
      gap: var(--s-2);
    }
    .page-hero-stat .num {
      font-size: var(--t-20) !important;
    }
    .page-hero-stat .lbl {
      font-size: var(--t-12) !important;
      margin-top: 0 !important;
    }
    .section {
      padding: var(--s-3) 0 !important;
    }
    .dept-grid {
      grid-template-columns: repeat(6, 1fr) !important;
      gap: var(--s-3) !important;
    }
    .dept-card {
      padding: var(--s-2) !important;
      min-height: 180px !important;
      justify-content: center !important;
      align-items: center !important;
      text-align: center !important;
    }
    .dept-logo {
      width: 72px !important;
      height: 72px !important;
      margin-bottom: var(--s-2) !important;
      padding: 2px !important;
    }
    .dept-card h3 {
      font-size: var(--t-12) !important;
      margin-bottom: 0 !important;
      font-weight: 500 !important;
      line-height: 1.25 !important;
    }
    .dept-meta {
      display: none !important;
    }
    .dept-arrow {
      display: none !important;
    }
    .dept-card:hover {
      transform: none !important;
    }
    @media (max-width: 1024px) {
      .dept-grid { grid-template-columns: repeat(6, 1fr) !important; }
      .dept-card { min-height: 140px !important; }
      .dept-logo { width: 44px !important; height: 44px !important; }
    }
    @media (max-width: 820px) {
      .dept-grid { grid-template-columns: repeat(4, 1fr) !important; } /* 3 rows on small tablets */
    }
    @media (max-width: 600px) {
      .dept-grid { grid-template-columns: repeat(3, 1fr) !important; }
    }
    @media (max-width: 400px) {
      .dept-grid { grid-template-columns: repeat(2, 1fr) !important; }
    }
  </style>
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>
<div id="sr-chrome-top"></div>

<main id="main" class="pub-v2">

  <section class="page-hero">
    <div class="container reveal">
      <div class="breadcrumb"><a href="index.html">Home</a> <i data-lucide="chevron-right" class="icon-sm"></i> <span>Publications</span></div>
      <h1>Publications</h1>
      <div style="display:flex; gap:var(--s-3); margin-top:var(--s-6); flex-wrap:wrap;">
        <div class="search-input" style="flex:1; max-width:420px;">
          <i data-lucide="search" class="icon-sm"></i>
          <input id="deptSearch" type="search" placeholder="Search publications…">
        </div>
        <div class="page-hero-stat" style="margin-left:auto;"><div class="num">100+</div><div class="lbl">Documents on record</div></div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="dept-grid" id="deptGrid"></div>
    </div>
  </section>

</main>

<div id="sr-chrome-footer"></div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="chrome.js"></script>
<script src="app.js"></script>
<script>
window.addEventListener('load', () => {
  const data = window.SR_DEPTS_CV || [];
  const logos = window.SR_LOGOS || {};
  const grid = document.getElementById('deptGrid');

  const DEPT_CATEGORY_MAP = {
    'kspcb': ['KSPCB_publications'],
    'kali-tiger-reserve': ['Kali Tiger Reserve_publications'],
    'nagarhole-national-park': ['Nagarhole_publications'],
    'karnataka-forest-department': ['Karnataka Forest Department_publica', 'Wildlife & Forest'],
    'shimoga': ['Shimoga_Publications'],
    'chitradurga': ['Chitradurga_publications'],
    'kalaburagi': ['Gulbarga_publications'],
    'academics': ['Academics_publications'],
    'adcl': ['ADCL_publications'],
    'ayush': [],
    'kfcsc': [],
    'general': ['Publications']
  };

  let publicationsData = null;
  let postsData = null;

  async function loadData() {
    if (!publicationsData) {
      const r = await fetch('./publications.json');
      publicationsData = await r.json();
    }
    if (!postsData) {
      const r = await fetch('./assets/posts-full.json');
      postsData = await r.json();
    }
  }

  // Pre-load data in the background
  loadData().catch(err => console.error('Error pre-loading publications data:', err));

  function render(filter){
    const q = (filter || '').toLowerCase().trim();
    const list = q ? data.filter(d => d.name.toLowerCase().includes(q) || d.kind.toLowerCase().includes(q)) : data;
    if (!list.length){
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><i data-lucide="search-x"></i><p>No departments match.</p></div>';
      window.SrIcons && window.SrIcons(); return;
    }
    grid.innerHTML = list.map(d => `
      <button class="dept-card" data-slug="${d.slug}" aria-label="${d.name}">
        <img class="dept-logo" src="${logos[d.slug] || ''}" alt="" loading="lazy">
        <h3>${d.name}</h3>
      </button>
    `).join('');
    window.SrIcons && window.SrIcons();
    grid.querySelectorAll('.dept-card').forEach(c => c.addEventListener('click', () => openDept(c.dataset.slug)));
  }
  document.getElementById('deptSearch').addEventListener('input', e => render(e.target.value));
  render();

  // Load publications locally
  async function getPubs(slug){
    try {
      await loadData();
      if (!publicationsData || !publicationsData.departments) return [];

      const mappedCats = DEPT_CATEGORY_MAP[slug] || [];

      // Collect all items across all departments to handle potential Wix category/department misalignments
      const allPubs = [];
      const seenIds = new Set();
      for (const deptKey in publicationsData.departments) {
        const list = publicationsData.departments[deptKey] || [];
        for (const item of list) {
          if (!seenIds.has(item.id)) {
            seenIds.add(item.id);
            allPubs.push(item);
          }
        }
      }

      // Filter publications belonging to this department
      const filtered = allPubs.filter(p => {
        if (p.dept === slug) return true;
        if (p.categories) {
          const itemCats = p.categories.split(',').map(c => c.trim().toLowerCase());
          const hasCatMatch = mappedCats.some(mc => itemCats.includes(mc.toLowerCase()));
          if (hasCatMatch) return true;
        }
        return false;
      });

      // Enrich with detailed metadata from posts-full.json
      const enriched = filtered.map(p => {
        const post = (postsData || []).find(post => post.slug === p.slug);
        return {
          title: p.title || (post && post.title) || '',
          slug: p.slug,
          postPageUrl: `posts/${p.slug}.html`,
          coverImage: (post && post.image) || '',
          language: (post && post.language) || 'EN',
          publishedDate: (post && post.date) || new Date().toISOString(),
          timeToRead: (post && (post.minutesToRead || post.timeToRead)) || 0
        };
      });

      // Sort by publication date descending
      enriched.sort((a, b) => new Date(b.publishedDate) - new Date(a.publishedDate));

      return enriched;
    } catch (error) {
      console.error(`Error filtering publications for ${slug}:`, error);
      return [];
    }
  }

  function openDept(slug){
    const d = data.find(x => x.slug === slug);
    if (!d) return;
    const logo = logos[slug];

    const url = new URL(location.href);
    url.searchParams.set('dept', slug);
    history.replaceState(null,'',url);

    // Show loading state
    const drawerHtml = `
      <header class="drawer-head">
        <img class="drawer-head-logo" src="${logo||''}" alt="">
        <div class="drawer-head-text">
          <h2>${d.name}</h2>
          <div class="meta">${d.period}</div>
        </div>
        <button class="drawer-close" aria-label="Close"><i data-lucide="x"></i></button>
      </header>
      <div class="drawer-body" style="padding:var(--s-6);text-align:center;">
        <p>Loading publications...</p>
      </div>
    `;
    DeptDrawer.open(drawerHtml);

    // Fetch publications
    getPubs(slug).then(pubs => {
      const pubHtml = pubs.length ? pubs.map(p => `
        <a class="pub-card" href="${p.postPageUrl || '#'}" target="_blank" rel="noopener">
          <div class="pub-cover"><img src="${p.coverImage || 'https://images.unsplash.com/photo-1457369804613-52c61a468e7d?w=400'}" alt="" loading="lazy"></div>
          <div class="pub-body">
            <div class="pub-title">${p.title}</div>
            <div class="pub-meta">
              <span class="lang-flag ${(p.language || 'EN').toLowerCase()}">${p.language || 'EN'}</span>
              <span>${new Date(p.publishedDate).getFullYear()}</span>
              ${p.timeToRead ? `<span>·</span><span>${p.timeToRead} min</span>` : ''}
            </div>
            <div class="pub-actions">
              <a href="${p.postPageUrl || '#'}" target="_blank" class="btn btn-outline btn-sm"><i data-lucide="external-link" class="icon-sm"></i> Open</a>
            </div>
          </div>
        </a>`).join('') :
        '<div class="empty-state"><i data-lucide="file-text"></i><p>No publications found for this department.</p></div>';

      const html = `
        <header class="drawer-head">
          <img class="drawer-head-logo" src="${logo||''}" alt="">
          <div class="drawer-head-text">
            <h2>${d.name}</h2>
            <div class="meta">${d.period} · ${pubs.length} publications</div>
          </div>
          <button class="drawer-close" aria-label="Close"><i data-lucide="x"></i></button>
        </header>
        <div class="drawer-tabs">
          <button class="tab is-active" data-target="dc-${slug}">Publications</button>
          <button class="tab" data-target="info-${slug}">About</button>
        </div>
        <div class="drawer-body">
          <section class="tab-panel is-active" id="dc-${slug}">
            ${pubHtml}
          </section>
          <section class="tab-panel" id="info-${slug}">
            <p style="color:var(--ink-2);line-height:1.7;">Service period: <strong>${d.period}</strong>. Role: <strong>${d.kind}</strong>. Related posts available on the <a href="accomplishments.html?dept=${slug}" style="color:var(--brand);">Accomplishments page</a>.</p>
          </section>
        </div>
      `;
      DeptDrawer.open(html);
    });
  }

  const params = new URLSearchParams(location.search);
  const depParam = params.get('dept');
  if (depParam) setTimeout(() => openDept(depParam), 200);
});
</script>
</body>
</html>
