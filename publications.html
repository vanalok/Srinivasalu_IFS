<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Publications — Srinivasulu IFS</title>
  <meta name="description" content="Reports, policy documents and publications across departments.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Kannada:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="publications-premium.css" />
  <style>
    /* ── Dept grid layout ─────────────────────────────────────────────── */
    .page-hero { padding: var(--s-3) 0 !important; }
    .page-hero h1 { font-size: var(--t-24) !important; margin-bottom: var(--s-1) !important; }
    .page-hero .breadcrumb { margin-bottom: var(--s-1) !important; }
    .page-hero-stat { display: flex; align-items: baseline; gap: var(--s-2); }
    .page-hero-stat .num { font-size: var(--t-20) !important; }
    .page-hero-stat .lbl { font-size: var(--t-12) !important; margin-top: 0 !important; }
    .section { padding: var(--s-3) 0 !important; }
    .dept-grid {
      grid-template-columns: repeat(6, 1fr) !important;
      gap: var(--s-3) !important;
    }
    .dept-card {
      padding: var(--s-2) !important;
      min-height: 180px !important;
      justify-content: center !important;
      align-items: center !important;
      text-align: center !important;
    }
    .dept-logo {
      width: 72px !important; height: 72px !important;
      margin-bottom: var(--s-2) !important; padding: 2px !important;
    }
    .dept-card h3 {
      font-size: var(--t-12) !important; margin-bottom: 0 !important;
      font-weight: 500 !important; line-height: 1.25 !important;
    }
    .dept-meta, .dept-arrow { display: none !important; }
    .dept-card:hover { transform: none !important; }

    @media (max-width: 1024px) {
      .dept-grid { grid-template-columns: repeat(6, 1fr) !important; }
      .dept-card { min-height: 140px !important; }
      .dept-logo { width: 44px !important; height: 44px !important; }
    }
    @media (max-width: 820px) {
      .dept-grid { grid-template-columns: repeat(4, 1fr) !important; }
    }
    @media (max-width: 600px) {
      .dept-grid { grid-template-columns: repeat(3, 1fr) !important; }
    }
    @media (max-width: 400px) {
      .dept-grid { grid-template-columns: repeat(2, 1fr) !important; }
    }

    /* ── Publication card — single unified card ───────────────────────── */
    /*
      publications-premium.css already sets .pub-v2 .pub-card to
      display:flex; flex-direction:column  (vertical stack: cover → body → actions).
      We must NOT add display:grid or grid-template-columns here.
      These rules only supply the few missing pieces the premium CSS doesn't cover.
    */
    .pub-v2 .pub-card {
      /* reset any stray grid from older drafts */
      display: flex !important;
      flex-direction: column !important;
      grid-template-columns: unset !important;
    }

    /* Cover — full-width banner at top of card */
    .pub-v2 .pub-cover {
      width: 100% !important;
      height: auto !important;
      aspect-ratio: 16 / 9 !important;
      border-radius: 16px 16px 0 0 !important;
      flex-shrink: 0;
    }
    .pub-v2 .pub-cover img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }

    /* Body fills remaining space */
    .pub-v2 .pub-body {
      display: flex !important;
      flex-direction: column !important;
      flex: 1 !important;
      padding: 14px 16px 14px !important;
    }

    /* Action buttons pinned to bottom */
    .pub-v2 .pub-actions {
      margin-top: auto;
      padding-top: 8px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .pub-v2 .pub-actions .btn {
      height: 30px; padding: 0 13px; font-size: var(--t-12);
    }

    /* ── Responsive overrides — keep flex, never reintroduce grid ─────── */
    @media (max-width: 1024px) {
      .pub-v2 .pub-card {
        display: flex !important;
        flex-direction: column !important;
        grid-template-columns: unset !important;
        padding: 0 !important;
      }
    }
    @media (max-width: 600px) {
      .pub-v2 .pub-card {
        display: flex !important;
        flex-direction: column !important;
        grid-template-columns: unset !important;
      }
      .pub-v2 .pub-cover {
        aspect-ratio: 16 / 9 !important;
        max-width: 100% !important;
      }
    }
    @media (max-width: 480px) {
      .pub-v2 .pub-card {
        display: flex !important;
        flex-direction: column !important;
        grid-template-columns: unset !important;
      }
    }
  </style>
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>
<div id="sr-chrome-top"></div>

<main id="main" class="pub-v2">

  <section class="page-hero">
    <div class="container reveal">
      <div class="breadcrumb"><a href="index.html">Home</a> <i data-lucide="chevron-right" class="icon-sm"></i> <span>Publications</span></div>
      <h1>Publications</h1>
      <div style="display:flex; gap:var(--s-3); margin-top:var(--s-6); flex-wrap:wrap;">
        <div class="search-input" style="flex:1; max-width:420px;">
          <i data-lucide="search" class="icon-sm"></i>
          <input id="deptSearch" type="search" placeholder="Search publications…">
        </div>
        <div class="page-hero-stat" style="margin-left:auto;">
          <div class="num">100+</div>
          <div class="lbl">Documents on record</div>
        </div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="dept-grid" id="deptGrid"></div>
    </div>
  </section>

</main>

<div id="sr-chrome-footer"></div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="chrome.js"></script>
<script src="app.js"></script>
<script>
window.addEventListener('load', () => {
  const data   = window.SR_DEPTS_CV || [];
  const logos  = window.SR_LOGOS    || {};
  const grid   = document.getElementById('deptGrid');

  const DEPT_CATEGORY_MAP = {
    'kspcb':                      ['KSPCB_publications'],
    'kali-tiger-reserve':         ['Kali Tiger Reserve_publications'],
    'nagarhole-national-park':    ['Nagarhole_publications'],
    'karnataka-forest-department':['Karnataka Forest Department_publica','Wildlife & Forest'],
    'shimoga':                    ['Shimoga_Publications'],
    'chitradurga':                ['Chitradurga_publications'],
    'kalaburagi':                 ['Gulbarga_publications'],
    'academics':                  ['Academics_publications'],
    'adcl':                       ['ADCL_publications'],
    'ayush':                      [],
    'kfcsc':                      [],
    'general':                    ['Publications']
  };

  let publicationsData = null;
  let postsData        = null;

  async function loadData() {
    if (!publicationsData) {
      const r = await fetch('./publications.json');
      publicationsData = await r.json();
    }
    if (!postsData) {
      const r = await fetch('./assets/posts-full.json');
      postsData = await r.json();
    }
  }

  /* pre-load in background */
  loadData().catch(err => console.error('Error pre-loading publications data:', err));

  /* ── Dept grid ── */
  function render(filter) {
    const q    = (filter || '').toLowerCase().trim();
    const list = q
      ? data.filter(d => d.name.toLowerCase().includes(q) || d.kind.toLowerCase().includes(q))
      : data;

    if (!list.length) {
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><i data-lucide="search-x"></i><p>No departments match.</p></div>';
      window.SrIcons && window.SrIcons();
      return;
    }

    grid.innerHTML = list.map(d => `
      <button class="dept-card" data-slug="${d.slug}" aria-label="${d.name}">
        <img class="dept-logo" src="${logos[d.slug] || ''}" alt="" loading="lazy">
        <h3>${d.name}</h3>
      </button>
    `).join('');

    window.SrIcons && window.SrIcons();
    grid.querySelectorAll('.dept-card').forEach(c =>
      c.addEventListener('click', () => openDept(c.dataset.slug))
    );
  }

  document.getElementById('deptSearch')
    .addEventListener('input', e => render(e.target.value));
  render();

  /* ── Fetch publications for a dept ── */
  async function getPubs(slug) {
    try {
      await loadData();
      if (!publicationsData || !publicationsData.departments) return [];

      const mappedCats = DEPT_CATEGORY_MAP[slug] || [];

      /* de-dupe across all departments */
      const allPubs = [];
      const seenIds = new Set();
      for (const deptKey in publicationsData.departments) {
        for (const item of (publicationsData.departments[deptKey] || [])) {
          if (!seenIds.has(item.id)) { seenIds.add(item.id); allPubs.push(item); }
        }
      }

      /* filter by dept slug or category */
      const filtered = allPubs.filter(p => {
        if (p.dept === slug) return true;
        if (p.categories) {
          const itemCats = p.categories.split(',').map(c => c.trim().toLowerCase());
          if (mappedCats.some(mc => itemCats.includes(mc.toLowerCase()))) return true;
        }
        return false;
      });

      /* enrich with posts-full metadata */
      const enriched = filtered.map(p => {
        const post = (postsData || []).find(x => x.slug === p.slug);
        return {
          title:         p.title || (post && post.title) || '',
          slug:          p.slug,
          postPageUrl:   `posts/${p.slug}.html`,
          coverImage:    (post && post.image) || '',
          language:      (post && post.language)   || 'EN',
          publishedDate: (post && post.date)        || new Date().toISOString(),
          timeToRead:    (post && (post.minutesToRead || post.timeToRead)) || 0
        };
      });

      enriched.sort((a, b) => new Date(b.publishedDate) - new Date(a.publishedDate));
      return enriched;

    } catch (error) {
      console.error(`Error filtering publications for ${slug}:`, error);
      return [];
    }
  }

  /* ── Build a single publication card (vertical, no grid) ── */
  function pubCardHtml(p) {
    const lang      = (p.language || 'EN').toLowerCase();
    const langLabel = lang === 'kn' ? 'ಕನ್ನಡ' : (p.language || 'EN');
    const year      = new Date(p.publishedDate).getFullYear();
    const readTime  = p.timeToRead ? `<span class="dot"></span><span>${p.timeToRead} min read</span>` : '';
    const cover     = p.coverImage
      ? `<img src="${p.coverImage}" alt="" loading="lazy">`
      : `<div class="pub-cover-placeholder"><i data-lucide="file-text"></i></div>`;

    return `
      <a class="pub-card" href="${p.postPageUrl || '#'}" target="_blank" rel="noopener">
        <div class="pub-cover">${cover}</div>
        <div class="pub-body">
          <div class="pub-title">${p.title}</div>
          <div class="pub-meta">
            <span class="lang-flag ${lang}">${langLabel}</span>
            <span class="dot"></span>
            <span>${year}</span>
            ${readTime}
          </div>
          <div class="pub-actions">
            <a href="${p.postPageUrl || '#'}" target="_blank" rel="noopener"
               class="btn btn-outline btn-sm">
              <i data-lucide="external-link" class="icon-sm"></i> Open
            </a>
          </div>
        </div>
      </a>`;
  }

  /* ── Open dept drawer ── */
  function openDept(slug) {
    const d    = data.find(x => x.slug === slug);
    if (!d) return;
    const logo = logos[slug];

    const url = new URL(location.href);
    url.searchParams.set('dept', slug);
    history.replaceState(null, '', url);

    /* loading state */
    DeptDrawer.open(`
      <header class="drawer-head">
        <img class="drawer-head-logo" src="${logo || ''}" alt="">
        <div class="drawer-head-text">
          <h2>${d.name}</h2>
          <div class="meta">${d.period}</div>
        </div>
        <button class="drawer-close" aria-label="Close"><i data-lucide="x"></i></button>
      </header>
      <div class="drawer-body" style="padding:var(--s-6);text-align:center;">
        <p>Loading publications…</p>
      </div>
    `);

    /* fetch then render */
    getPubs(slug).then(pubs => {
      const pubHtml = pubs.length
        ? `<div class="pub-grid">${pubs.map(pubCardHtml).join('')}</div>`
        : `<div class="drawer-empty">
             <i data-lucide="file-text"></i>
             <p>No publications found for this department.</p>
           </div>`;

      DeptDrawer.open(`
        <header class="drawer-head">
          <img class="drawer-head-logo" src="${logo || ''}" alt="">
          <div class="drawer-head-text">
            <h2>${d.name}</h2>
            <div class="meta">
              ${d.period}
              <span class="meta-sep"></span>
              <span class="meta-badge">${pubs.length} publications</span>
            </div>
          </div>
          <button class="drawer-close" aria-label="Close"><i data-lucide="x"></i></button>
        </header>

        <div class="drawer-tabs">
          <button class="tab is-active" data-target="dc-${slug}">Publications</button>
          <button class="tab"           data-target="info-${slug}">About</button>
        </div>

        <div class="drawer-body">
          <section class="tab-panel is-active" id="dc-${slug}">
            ${pubHtml}
          </section>
          <section class="tab-panel" id="info-${slug}">
            <p>Service period: <strong>${d.period}</strong>. Role: <strong>${d.kind}</strong>.
               Related posts available on the
               <a href="accomplishments.html?dept=${slug}">Accomplishments page</a>.</p>
          </section>
        </div>
      `);
    });
  }

  /* ── Auto-open from URL param ── */
  const depParam = new URLSearchParams(location.search).get('dept');
  if (depParam) setTimeout(() => openDept(depParam), 200);
});
</script>
</body>
</html>
