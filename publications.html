<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Publications — Srinivasulu IFS</title>
  <meta name="description" content="Reports, policy documents and publications across departments.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+Kannada:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="design-system.css">
  <link rel="stylesheet" href="publications-premium.css" />
  <style>
    /* ── Dept grid layout ─── */
    .page-hero { padding: var(--s-3) 0 !important; }
    .page-hero h1 { font-size: var(--t-24) !important; margin-bottom: var(--s-1) !important; }
    .page-hero .breadcrumb { margin-bottom: var(--s-1) !important; }
    .page-hero-stat { display: flex; align-items: baseline; gap: var(--s-2); }
    .page-hero-stat .num { font-size: var(--t-20) !important; }
    .page-hero-stat .lbl { font-size: var(--t-12) !important; margin-top: 0 !important; }
    .section { padding: var(--s-3) 0 !important; }

    /* ── Publication card — single unified card ───────────────────────── */
    /*
      publications-premium.css already sets .pub-v2 .pub-card to
      display:flex; flex-direction:column  (vertical stack: cover → body → actions).
      We must NOT add display:grid or grid-template-columns here.
      These rules only supply the few missing pieces the premium CSS doesn't cover.
    */
    .pub-v2 .pub-card {
      /* reset any stray grid from older drafts */
      display: flex !important;
      flex-direction: column !important;
      grid-template-columns: unset !important;
    }

    /* Cover — full-width banner at top of card */
    .pub-v2 .pub-cover {
      width: 100% !important;
      height: auto !important;
      aspect-ratio: 16 / 9 !important;
      border-radius: 16px 16px 0 0 !important;
      flex-shrink: 0;
    }
    .pub-v2 .pub-cover img {
      width: 100%; height: 100%; object-fit: cover; display: block;
    }

    /* Body fills remaining space */
    .pub-v2 .pub-body {
      display: flex !important;
      flex-direction: column !important;
      flex: 1 !important;
      padding: 14px 16px 14px !important;
    }

    /* Action buttons pinned to bottom */
    .pub-v2 .pub-actions {
      margin-top: auto;
      padding-top: 8px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .pub-v2 .pub-actions .btn {
      height: 30px; padding: 0 13px; font-size: var(--t-12);
    }

    /* ── Responsive overrides — keep flex, never reintroduce grid ─────── */
    @media (max-width: 1024px) {
      .pub-v2 .pub-card {
        display: flex !important;
        flex-direction: column !important;
        grid-template-columns: unset !important;
        padding: 0 !important;
      }
    }
    @media (max-width: 600px) {
      .pub-v2 .pub-card {
        display: flex !important;
        flex-direction: column !important;
        grid-template-columns: unset !important;
      }
      .pub-v2 .pub-cover {
        aspect-ratio: 16 / 9 !important;
        max-width: 100% !important;
      }
    }
    @media (max-width: 480px) {
      .pub-v2 .pub-card {
        display: flex !important;
        flex-direction: column !important;
        grid-template-columns: unset !important;
      }
    }
  </style>
</head>
<body>

<a class="skip-link" href="#main">Skip to content</a>
<div id="sr-chrome-top"></div>

<main id="main" class="pub-v2">

  <section class="page-hero">
    <div class="container reveal">
      <div class="breadcrumb"><a href="index.html">Home</a> <i data-lucide="chevron-right" class="icon-sm"></i> <span>Publications</span></div>
      <h1>Publications</h1>
      <div style="display:flex; gap:var(--s-3); margin-top:var(--s-6); flex-wrap:wrap;">
        <div class="search-input" style="flex:1; max-width:420px;">
          <i data-lucide="search" class="icon-sm"></i>
          <input id="deptSearch" type="search" placeholder="Search publications…">
        </div>
        <div class="page-hero-stat" style="margin-left:auto;">
          <div class="num">100+</div>
          <div class="lbl">Documents on record</div>
        </div>
      </div>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="dept-grid" id="deptGrid"></div>
    </div>
  </section>

</main>

<div id="sr-chrome-footer"></div>

<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="chrome.js"></script>
<script src="app.js"></script>
<script>
window.addEventListener('load', () => {
  const data   = window.SR_DEPTS_CV || [];
  const logos  = window.SR_LOGOS    || {};
  const grid   = document.getElementById('deptGrid');

  /* ── Dept grid ── */
  function render(filter) {
    const q    = (filter || '').toLowerCase().trim();
    const list = q
      ? data.filter(d => d.name.toLowerCase().includes(q) || d.kind.toLowerCase().includes(q))
      : data;

    if (!list.length) {
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1;"><i data-lucide="search-x"></i><p>No departments match.</p></div>';
      window.SrIcons && window.SrIcons();
      return;
    }

    grid.innerHTML = list.map(d => `
      <a href="dept.html?dept=${d.slug}&page=publications" class="dept-card" style="text-decoration:none;color:inherit;">
        <img class="dept-logo" src="${logos[d.slug] || ''}" alt="${d.name}" loading="lazy">
        <h3>${d.name}</h3>
      </a>
    `).join('');

    window.SrIcons && window.SrIcons();
  }

  document.getElementById('deptSearch')
    .addEventListener('input', e => render(e.target.value));
  render();

});
</script>
</body>
</html>
